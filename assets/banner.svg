<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" width="1280" height="340" role="img" aria-label="Daniele Cappello, poietic architect, AI solutions. Dal broadcast all'AI generativa: broadcast, finanza, conformità documentale, ricerca.">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1420"/>
      <stop offset="60%" stop-color="#101E30"/>
      <stop offset="100%" stop-color="#16273C"/>
    </linearGradient>
    <linearGradient id="filo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C9A227" stop-opacity="0"/>
      <stop offset="18%" stop-color="#C9A227"/>
      <stop offset="82%" stop-color="#E3C563"/>
      <stop offset="100%" stop-color="#C9A227" stop-opacity="0"/>
    </linearGradient>
    <pattern id="griglia" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#243A54" stroke-width="1" stroke-opacity=".45"/>
    </pattern>
  </defs>

  <rect width="1280" height="340" fill="url(#fondo)"/>
  <rect width="1280" height="340" fill="url(#griglia)"/>

  <!-- montanti laterali, come i bordi di un pannello di regia -->
  <rect x="0" y="0" width="6" height="340" fill="#C9A227" opacity=".85"/>
  <rect x="1274" y="0" width="6" height="340" fill="#C9A227" opacity=".25"/>

  <!-- occhiello -->
  <text x="72" y="86" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="16" letter-spacing="6.5" fill="#C9A227">POIETIC ARCHITECT, AI SOLUTIONS</text>

  <!-- nome -->
  <text x="70" y="168" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="700"
        letter-spacing="-0.5" fill="#F2F6FA">Daniele Cappello</text>

  <!-- filo d'oro -->
  <rect x="72" y="196" width="420" height="3" fill="url(#filo)"/>

  <!-- claim -->
  <text x="72" y="240" font-family="Georgia, 'Times New Roman', serif" font-size="25" fill="#A9BACD">
    Dal broadcast all’AI generativa. Costruisco pipeline che danno forma.
  </text>

  <!-- riga di stato, come un tally -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" letter-spacing="2.5">
    <circle cx="80" cy="291" r="6" fill="#E2483D"/>
    <text x="96" y="297" fill="#8FA3B8">BROADCAST</text>

    <circle cx="290" cy="291" r="6" fill="#F0A32C"/>
    <text x="306" y="297" fill="#8FA3B8">FINANZA</text>

    <circle cx="474" cy="291" r="6" fill="#F0A32C"/>
    <text x="490" y="297" fill="#8FA3B8">CONFORMITÀ</text>

    <circle cx="702" cy="291" r="6" fill="#4FA3D1"/>
    <text x="718" y="297" fill="#8FA3B8">RICERCA</text>
  </g>

  <!-- sigla a destra -->
  <text x="1208" y="297" text-anchor="end"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="14" letter-spacing="3" fill="#41597A">SOLARYS451</text>
</svg>
